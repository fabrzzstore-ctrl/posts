# Gera e publica o blog no GitHub Pages.
# Se existir um site.zip no repositório, extrai-o primeiro (com as pastas certas) e guarda os ficheiros no repositório.
name: Publicar o blog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Extrair site.zip (se existir)
        run: |
          if [ -f site.zip ]; then
            unzip -o site.zip -d .
            git rm -q --cached site.zip || true
            rm -f site.zip
            git config user.name "noticias.semwhere"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Extrair site.zip" || echo "Nada para guardar"
            git push
          fi

      - name: Verificar se o site já está no repositório
        id: verificar
        run: |
          if [ -f build.py ]; then echo "pronto=sim" >> "$GITHUB_OUTPUT"; else echo "pronto=nao" >> "$GITHUB_OUTPUT"; echo "Ainda não há build.py nem site.zip. Carregue o site.zip para publicar."; fi

      - uses: actions/setup-python@v5
        if: steps.verificar.outputs.pronto == 'sim'
        with:
          python-version: "3.12"

      - name: Instalar dependências
        if: steps.verificar.outputs.pronto == 'sim'
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-crosextra-caladea fonts-inter
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Gerar o site
        if: steps.verificar.outputs.pronto == 'sim'
        run: python build.py --og

      - uses: actions/configure-pages@v5
        if: steps.verificar.outputs.pronto == 'sim'

      - uses: actions/upload-pages-artifact@v3
        if: steps.verificar.outputs.pronto == 'sim'
        with:
          path: docs

      - id: deploy
        if: steps.verificar.outputs.pronto == 'sim'
        uses: actions/deploy-pages@v4
