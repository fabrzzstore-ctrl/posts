# Gera e publica o blog no GitHub Pages.
# - A cada envio para o ramo main.
# - De 10 em 10 minutos: vai buscar ao Notion os artigos com Estado "Publicar" (segredo NOTION_TOKEN).
# - Se existir um site.zip no repositório, extrai-o primeiro.
name: Publicar o blog
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Extrair site.zip (se existir)
        run: |
          if [ -f site.zip ]; then
            unzip -o site.zip -d .
            git rm -q --cached site.zip || true
            rm -f site.zip
            git config user.name "noticias.semwhere"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Extrair site.zip" || echo "Nada para guardar"
            git push
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ir buscar artigos ao Notion
        id: notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          pip install -q PyYAML
          python notion_sync.py buscar
          git config user.name "noticias.semwhere"
          git config user.email "actions@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "novos=nao" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Artigos do Notion"
            git pull --rebase -q
            git push
            echo "novos=sim" >> "$GITHUB_OUTPUT"
          fi

      - name: Decidir se é preciso publicar
        id: decidir
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.notion.outputs.novos }}" = "sim" ]; then
            echo "publicar=sim" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=nao" >> "$GITHUB_OUTPUT"
            echo "Sem artigos novos no Notion."
          fi

      - name: Instalar dependências
        if: steps.decidir.outputs.publicar == 'sim'
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-crosextra-caladea fonts-inter
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Gerar o site
        if: steps.decidir.outputs.publicar == 'sim'
        run: python build.py --og

      - uses: actions/configure-pages@v5
        if: steps.decidir.outputs.publicar == 'sim'

      - uses: actions/upload-pages-artifact@v3
        if: steps.decidir.outputs.publicar == 'sim'
        with:
          path: docs

      - id: deploy
        if: steps.decidir.outputs.publicar == 'sim'
        uses: actions/deploy-pages@v4

      - name: Marcar artigos como publicados no Notion
        if: steps.notion.outputs.novos == 'sim' && success()
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python notion_sync.py marcar
